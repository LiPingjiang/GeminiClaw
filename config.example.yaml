server:
  port: 3000
  host: "0.0.0.0"
  # authToken: "your-secret-token"

providers:
  - name: mcli
    type: mcli
    apiKey: "your-mcli-api-key"
    baseUrl: "https://mcli.sankuai.com"   # 注意：不要带 /v1 后缀， provider 内部会自动拼接
    # extraHeaders：如果你的 mcli 需要额外 header（如美团内部部署），在此配置
    # extraHeaders:
    #   X-Working-Dir: "/your/project/path"
    models:
      - claude-opus-4-6
      - claude-sonnet-4-6

  - name: friday
    type: friday
    apiKey: "your-friday-api-key"
    baseUrl: "https:///v1/openai/native"
    models:
      - gemini-3-flash-preview

routing:
  default: "mcli/claude-opus-4-6"
  fallback:
    - "mcli/claude-sonnet-4-6"
    - "friday/gemini-3-flash-preview"

memory:
  enabled: true
  dataDir: ".data"
  maxSessionAge: 86400

  # 记忆策略：
  #   buffer  = 滑动窗口（纯内存，重启丢失，适合开发/测试）
  #   layered = 分层 topics（SQLite 持久化，完整记忆系统，需要 friday provider）
  strategy: buffer

  maxActiveTopics: 16             # 最多保持活跃的事项数
  compactThresholdBytes: 6144     # 事项文档超过此大小触发摘要压缩（6KB）
  recentMessageLimit: 20          # 注入 context 的近期消息条数
  triageAfterTurns: 3             # 累计几轮后触发立项判断

agent:
  maxTurns: 20
  timeoutSeconds: 60

# ── Twin-System 自进化引擎 ────────────────────────────────────────────────────
# 默认关闭。开启后 GeminiClaw 会在空闲时自动进化自身代码。
evolution:
  enabled: false
  dataDir: ".gemini-data"               # SQLite + evolution artifacts 存储目录

  # 调度器
  idleThresholdMs: 300000               # 空闲 5 分钟后触发
  cronIntervalMs: 1800000               # 每 30 分钟定时检查（0 = 禁用 cron）
  cooldownMs: 600000                    # 两次触发之间最少间隔 10 分钟

  # 变异器
  maxMutationRounds: 3                  # LLM 最多重试轮次
  confidenceThreshold: 0.7              # 置信度阈值（低于此值需人工审批）

  # 验证器
  testPort: 19889                       # Level 2 验证的临时进程端口

  # 切换后监控
  postSwitchMonitorMs: 300000           # 切换后监控窗口 5 分钟
  failureRateThreshold: 0.1             # 错误率超过 10% 触发回滚

  # 安全护栏
  protectedPaths:                       # 不允许自动进化的路径
    - "src/config/"
    - "src/twin-system/"
    - ".gemini-data/"
  maxEvolutionsPerFile24h: 3            # 单文件 24h 内最多进化次数

  # 流水线
  autoSwitch: false                     # true = 验证通过自动切换；false = 需人工审批
  mainBranch: "main"                    # Git 主分支名
