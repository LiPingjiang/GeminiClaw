server:
  port: 18888
  host: "127.0.0.1"
  # authToken: "your-secret-token"   # optional, for API auth

# ── Providers ──────────────────────────────────────────────────────────────────
# type: "anthropic"  — Anthropic-compatible API (official or any proxy)
# type: "openai"     — OpenAI-compatible API (OpenAI, DeepSeek, Gemini, Hunyuan, Ollama, etc.)
#
# Tip: if you use a local proxy (e.g. proxy.py) that handles auth/billing,
# just point baseUrl at the proxy — GeminiClaw will treat it as a regular provider.

providers:
  # ── Example 1: Anthropic (official) ────────────────────────────────────────
  - name: anthropic
    type: anthropic
    apiKey: "sk-ant-..."
    models:
      - claude-opus-4-5
      - claude-sonnet-4-5

  # ── Example 2: OpenAI ───────────────────────────────────────────────────────
  # - name: openai
  #   type: openai
  #   apiKey: "sk-..."
  #   baseUrl: "https://api.openai.com/v1"
  #   models:
  #     - gpt-4o
  #     - gpt-4o-mini

  # ── Example 3: DeepSeek ─────────────────────────────────────────────────────
  # - name: deepseek
  #   type: openai
  #   apiKey: "sk-..."
  #   baseUrl: "https://api.deepseek.com/v1"
  #   models:
  #     - deepseek-chat
  #     - deepseek-reasoner

  # ── Example 4: Tencent Hunyuan (腾讯混元) ───────────────────────────────────
  # - name: hunyuan
  #   type: openai
  #   apiKey: "your-hunyuan-api-key"
  #   baseUrl: "https://api.hunyuan.cloud.tencent.com/v1"
  #   models:
  #     - hunyuan-turbos-latest
  #     - hunyuan-lite

  # ── Example 5: Local proxy (e.g. internal proxy.py) ─────────────────────────
  # - name: my-proxy
  #   type: anthropic
  #   apiKey: "your-key"
  #   baseUrl: "http://127.0.0.1:15231"   # proxy handles billing/auth
  #   models:
  #     - claude-opus-4-5
  #     - claude-sonnet-4-5

  # ── Example 6: Ollama (local) ───────────────────────────────────────────────
  # - name: ollama
  #   type: openai
  #   apiKey: "ollama"
  #   baseUrl: "http://localhost:11434/v1"
  #   models:
  #     - llama3.2
  #     - qwen2.5

routing:
  default: "anthropic/claude-sonnet-4-5"
  fallback:
    - "anthropic/claude-opus-4-5"

memory:
  enabled: true
  dataDir: ".data"
  strategy: buffer          # buffer (in-memory) or layered (SQLite, persistent)
  maxActiveTopics: 16
  recentMessageLimit: 20

agent:
  maxTurns: 20
  timeoutSeconds: 60

workspace:
  dir: ".workspace"         # put SOUL.md, USER.md, MEMORY.md, memory/ here

skills:
  dir: "skills"             # put skill .md files here
