server:
  port: 3000
  host: "0.0.0.0"
  # authToken: "your-secret-token"

providers:
  - name: anthropic
    type: anthropic
    apiKey: "sk-ant-..."
    models:
      - claude-opus-4-6
      - claude-sonnet-4-6

  - name: mcli
    type: mcli
    apiKey: "your-mcli-key"
    baseUrl: "https://your-mcli-endpoint/v1"
    models:
      - mcli-model-default

routing:
  default: "anthropic/claude-sonnet-4-6"
  fallback:
    - "anthropic/claude-sonnet-4-6"
    - "mcli/mcli-model-default"

memory:
  enabled: true
  dataDir: ".data/sessions"
  maxSessionAge: 86400

agent:
  maxTurns: 20
  timeoutSeconds: 60
