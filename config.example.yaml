server:
  port: 18888
  host: "127.0.0.1"
  # authToken: "your-secret-token"   # optional, for API auth

# ── Providers ──────────────────────────────────────────────────────────────────
# api: "anth-messages"        — Anthropic Messages API (official or any proxy)
# api: "openai-completions"   — OpenAI Chat Completions API (OpenAI, DeepSeek, Gemini, Hunyuan, Ollama, etc.)
#
# Tip: if you use a local proxy (e.g. proxy.py) that handles auth/billing,
# just point baseUrl at the proxy and use api: "anth-messages" — GeminiClaw
# will treat it as a regular Anthropic-protocol provider.

providers:
  # ── Example 1: Anthropic (official) ────────────────────────────────────────
  - name: anthropic
    api: "anth-messages"
    apiKey: "sk-ant-..."
    models:
      - claude-opus-4-5
      - claude-sonnet-4-5

  # ── Example 2: OpenAI ───────────────────────────────────────────────────────
  # - name: openai
  #   api: "openai-completions"
  #   apiKey: "sk-..."
  #   baseUrl: "https://api.openai.com/v1"
  #   models:
  #     - gpt-4o
  #     - gpt-4o-mini

  # ── Example 3: DeepSeek ─────────────────────────────────────────────────────
  # - name: deepseek
  #   api: "openai-completions"
  #   apiKey: "sk-..."
  #   baseUrl: "https://api.deepseek.com/v1"
  #   models:
  #     - deepseek-chat
  #     - deepseek-reasoner

  # ── Example 4: Tencent Hunyuan (腾讯混元) ───────────────────────────────────
  # - name: hunyuan
  #   api: "openai-completions"
  #   apiKey: "your-hunyuan-api-key"
  #   baseUrl: "https://api.hunyuan.cloud.tencent.com/v1"
  #   models:
  #     - hunyuan-turbos-latest
  #     - hunyuan-lite

  # ── Example 5: Local proxy (e.g. internal proxy.py) ─────────────────────────
  # - name: my-proxy
  #   api: "anth-messages"
  #   apiKey: "your-key"
  #   baseUrl: "http://127.0.0.1:15231"   # proxy handles billing/auth
  #   models:
  #     - claude-opus-4-5
  #     - claude-sonnet-4-5

  # ── Example 6: Ollama (local) ───────────────────────────────────────────────
  # - name: ollama
  #   api: "openai-completions"
  #   apiKey: "ollama"
  #   baseUrl: "http://localhost:11434/v1"
  #   models:
  #     - llama3.2
  #     - qwen2.5

routing:
  default: "anthropic/claude-sonnet-4-5"
  fallback:
    - "anthropic/claude-opus-4-5"

memory:
  enabled: true
  dataDir: ".data"
  strategy: buffer          # buffer (in-memory) or layered (SQLite, persistent)
  maxActiveTopics: 16
  recentMessageLimit: 20

agent:
  maxTurns: 20
  timeoutSeconds: 60

workspace:
  dir: ".workspace"         # put SOUL.md, USER.md, MEMORY.md, memory/ here

skills:
  dir: "skills"             # put skill .md files here

# ── Channels（可选）────────────────────────────────────────────
channels:
  qqbot:
    enabled: false
    mode: websocket          # websocket（主动连 QQ 网关）或 webhook（接收 HTTP 推送）
    appId: "your-qqbot-appid"
    clientSecret: "your-qqbot-secret"
    # webhookPath: "/webhook/qqbot"   # 仅 webhook 模式需要
    # intents: 1073741824              # 仅 websocket 模式，C2C 消息
