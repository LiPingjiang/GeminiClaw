server:
  port: 3000
  host: "0.0.0.0"
  # authToken: "your-secret-token"

providers:
  - name: anthropic
    type: anthropic
    apiKey: "sk-ant-..."
    models:
      - claude-opus-4-6
      - claude-sonnet-4-6

  - name: mcli
    type: mcli
    apiKey: "your-mcli-key"
    baseUrl: "https://your-mcli-endpoint/v1"
    models:
      - mcli-model-default

routing:
  default: "anthropic/claude-sonnet-4-6"
  fallback:
    - "anthropic/claude-sonnet-4-6"
    - "mcli/mcli-model-default"

memory:
  enabled: true
  dataDir: ".data"
  maxSessionAge: 86400
  # strategy: buffer    # buffer = 滑动窗口（纯内存，默认）
  # strategy: layered   # layered = 分层 topics（SQLite，完整记忆系统）
  strategy: buffer
  maxActiveTopics: 16
  compactThresholdBytes: 6144   # 6KB，超过触发摘要压缩
  recentMessageLimit: 20
  triageAfterTurns: 3

agent:
  maxTurns: 20
  timeoutSeconds: 60
