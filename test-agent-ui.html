<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiClaw Agent Modes 测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e2e2e2; height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 12px 16px; border-bottom: 1px solid #2a2a35; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .mode-select { margin-left: auto; display: flex; gap: 6px; }
  .mode-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid #2a2a35; background: #1a1a22; color: #aaa; font-size: 12px; cursor: pointer; }
  .mode-btn.active { border-color: #7c3aed; color: #a78bfa; background: rgba(124,58,237,0.1); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: #7c3aed; color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1e1e28; border: 1px solid #2a2a35; border-bottom-left-radius: 4px; white-space: pre-wrap; }
  .msg.system { align-self: center; font-size: 12px; color: #666; background: none; border: none; }
  .tool-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; }
  .tool-badge.start { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
  .tool-badge.end-ok { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
  .tool-badge.end-err { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
  .pause-card { border: 1px solid rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); border-radius: 12px; padding: 14px; margin: 8px 0; }
  .pause-card h3 { font-size: 13px; color: #fbbf24; margin-bottom: 10px; }
  .pause-card .q-item { margin-bottom: 10px; }
  .pause-card .q-label { font-size: 12px; color: #d1d5db; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .badge-required { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
  .badge-optional { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(107,114,128,0.2); color: #9ca3af; border: 1px solid #2a2a35; }
  .pause-card input { width: 100%; padding: 6px 10px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 6px; color: #e2e2e2; font-size: 13px; outline: none; }
  .pause-card input:focus { border-color: rgba(245,158,11,0.4); }
  .pause-card .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn-submit { padding: 6px 14px; background: #f59e0b; color: #000; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-skip { padding: 6px 14px; background: none; border: 1px solid #2a2a35; color: #9ca3af; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .guardrail-warn { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); color: #fbbf24; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  .guardrail-halt { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #f87171; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  .input-row { padding: 12px 16px; border-top: 1px solid #2a2a35; display: flex; gap: 8px; }
  .input-row textarea { flex: 1; background: #1a1a22; border: 1px solid #2a2a35; border-radius: 10px; color: #e2e2e2; padding: 8px 12px; font-size: 14px; resize: none; outline: none; height: 40px; }
  .input-row textarea:focus { border-color: rgba(124,58,237,0.5); }
  .send-btn { padding: 8px 16px; background: #7c3aed; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #444; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar { font-size: 11px; color: #555; padding: 0 16px 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 GeminiClaw</h1>
  <div class="mode-select" id="modeSelect">
    <button class="mode-btn active" data-mode="auto">Auto</button>
    <button class="mode-btn" data-mode="step">Step</button>
    <button class="mode-btn" data-mode="plan">Plan</button>
    <button class="mode-btn" data-mode="high-confidence">高置信度</button>
  </div>
</div>

<div class="messages" id="messages"></div>
<div class="status-bar" id="statusBar"></div>

<div class="input-row">
  <textarea id="inputBox" placeholder="输入消息，Enter 发送..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
</div>

<script>
const API = 'http://127.0.0.1:18889'
const TOKEN = 'gemeniclaw-local-dev-token-2026'
const SESSION_ID = 'test-ui-' + Math.random().toString(36).slice(2, 8)

let currentMode = 'auto'
let loading = false
let pauseState = null  // { pauseId, kind, data }

// ── Mode switching ──────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const mode = btn.dataset.mode
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentMode = mode

    // Send /mode command to backend
    try {
      await fetch(`${API}/v1/agent/chat`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `/mode ${mode}`, sessionId: SESSION_ID, stream: false }),
      })
      addMsg('system', `模式已切换为 ${mode}`)
    } catch(e) { addMsg('system', '模式切换失败') }
  })
})

// ── Message helpers ─────────────────────────────────────────────────────────
function addMsg(role, content) {
  const div = document.createElement('div')
  div.className = `msg ${role}`
  div.textContent = content
  document.getElementById('messages').appendChild(div)
  scrollBottom()
  return div
}

function addToolBadge(name, isEnd, isError) {
  const span = document.createElement('span')
  span.className = `tool-badge ${isEnd ? (isError ? 'end-err' : 'end-ok') : 'start'}`
  span.textContent = isEnd ? `✓ ${name}` : `⚙ ${name}`
  const last = document.getElementById('messages').lastElementChild
  if (last && last.classList.contains('assistant')) {
    last.appendChild(document.createElement('br'))
    last.appendChild(span)
  } else {
    const div = document.createElement('div')
    div.className = 'msg assistant'
    div.appendChild(span)
    document.getElementById('messages').appendChild(div)
  }
  scrollBottom()
}

function scrollBottom() {
  const m = document.getElementById('messages')
  m.scrollTop = m.scrollHeight
}

function setStatus(text) {
  document.getElementById('statusBar').textContent = text
}

// ── Pause / resume UI ───────────────────────────────────────────────────────
function showUncertaintyCard(items, pauseId) {
  pauseState = { pauseId, kind: 'uncertainty_check', data: { items } }

  const card = document.createElement('div')
  card.className = 'pause-card'
  card.id = 'pauseCard'
  card.innerHTML = `<h3>⚠️ 需要回答以下问题才能继续</h3>`

  const answers = {}
  items.forEach(item => {
    answers[item.id] = ''
    const qDiv = document.createElement('div')
    qDiv.className = 'q-item'
    qDiv.innerHTML = `
      <div class="q-label">
        <span class="${item.impact === 'blocking' ? 'badge-required' : 'badge-optional'}">
          ${item.impact === 'blocking' ? '必填' : '可选'}
        </span>
        ${item.question}
      </div>
      <input type="text" placeholder="${item.impact === 'blocking' ? '请输入答案（必填）' : '可留空'}"
             data-id="${item.id}" />
    `
    card.appendChild(qDiv)
  })

  const btns = document.createElement('div')
  btns.className = 'btns'

  const submitBtn = document.createElement('button')
  submitBtn.className = 'btn-submit'
  submitBtn.textContent = '提交答案'
  submitBtn.onclick = () => {
    const inputs = card.querySelectorAll('input[data-id]')
    const answersMap = {}
    inputs.forEach(inp => { answersMap[inp.dataset.id] = inp.value })
    resumeLoop(JSON.stringify(answersMap))
    card.remove()
  }

  const skipBtn = document.createElement('button')
  skipBtn.className = 'btn-skip'
  skipBtn.textContent = '不确定，你自己决定，继续'
  skipBtn.onclick = () => { resumeLoop('skip_all'); card.remove() }

  btns.appendChild(submitBtn)
  btns.appendChild(skipBtn)
  card.appendChild(btns)

  // Update submit button disabled state
  card.addEventListener('input', () => {
    const blockingItems = items.filter(i => i.impact === 'blocking')
    const allAnswered = blockingItems.every(i => {
      const inp = card.querySelector(`input[data-id="${i.id}"]`)
      return inp && inp.value.trim()
    })
    submitBtn.disabled = !allAnswered
  })
  submitBtn.disabled = items.some(i => i.impact === 'blocking')

  document.getElementById('messages').appendChild(card)
  scrollBottom()
}

async function resumeLoop(input) {
  if (!pauseState) return
  const { pauseId } = pauseState
  pauseState = null
  setStatus('恢复中...')

  try {
    const res = await fetch(`${API}/v1/agent/resume`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID, pauseId, input }),
    })
    const data = await res.json()
    if (!data.ok) addMsg('system', '恢复失败: ' + JSON.stringify(data))
    else setStatus('已恢复，等待 Agent 继续...')
  } catch(e) {
    addMsg('system', '恢复请求失败: ' + e.message)
    setLoading(false)
  }
}

// ── Send message ────────────────────────────────────────────────────────────
async function sendMessage() {
  const box = document.getElementById('inputBox')
  const text = box.value.trim()
  if (!text || loading) return

  box.value = ''
  addMsg('user', text)
  setLoading(true)

  const assistantDiv = document.createElement('div')
  assistantDiv.className = 'msg assistant'
  document.getElementById('messages').appendChild(assistantDiv)
  scrollBottom()

  try {
    const res = await fetch(`${API}/v1/agent/chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: SESSION_ID, stream: true, mode: currentMode }),
    })

    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })

      const lines = buf.split('\n')
      buf = lines.pop()

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        const raw = line.slice(6).trim()
        if (raw === '[DONE]') { setLoading(false); break }

        let evt
        try { evt = JSON.parse(raw) } catch { continue }

        if (evt.choices?.[0]?.delta?.content) {
          assistantDiv.textContent += evt.choices[0].delta.content
          scrollBottom()
        } else if (evt.type === 'tool_start') {
          addToolBadge(evt.toolName, false)
        } else if (evt.type === 'tool_end') {
          addToolBadge(evt.toolName, true, evt.isError)
        } else if (evt.type === 'paused') {
          if (evt.payload?.kind === 'uncertainty_check') {
            showUncertaintyCard(evt.payload.data?.items ?? [], evt.pauseId)
            setStatus('⏸ 等待用户回答问题...')
          }
        } else if (evt.type === 'guardrail_warn') {
          const d = document.createElement('div')
          d.className = 'guardrail-warn'
          d.textContent = '⚠️ ' + evt.message
          document.getElementById('messages').appendChild(d)
        } else if (evt.type === 'guardrail_halt') {
          const d = document.createElement('div')
          d.className = 'guardrail-halt'
          d.textContent = '🛑 ' + evt.message
          document.getElementById('messages').appendChild(d)
          setLoading(false)
        } else if (evt.type === 'done') {
          setLoading(false)
          setStatus(`完成 · 模式: ${evt.mode ?? currentMode}`)
        }
      }
    }
  } catch(e) {
    addMsg('system', '请求失败: ' + e.message)
    setLoading(false)
  }
}

function setLoading(val) {
  loading = val
  document.getElementById('sendBtn').disabled = val
  document.getElementById('inputBox').disabled = val
  if (!val) setStatus('')
  else setStatus('思考中...')
}

// Enter to send
document.getElementById('inputBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
})

// Initial greeting
addMsg('system', `Session: ${SESSION_ID} · GeminiClaw 本地测试页`)
</script>
</body>
</html>
